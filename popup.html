<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">◑ <b>DarkMode</b></span>
    <span id="ver" class="ver"></span>
  </header>

  <div id="host" class="host"></div>

  <button id="btn-toggle" class="big">🌙 Darken this page</button>
  <button id="btn-force" class="big force" hidden>⚠️ Invert anyway</button>
  <div id="hint" class="hint">Applies now. Nothing is remembered until you check below.</div>

  <label class="remember">
    <input type="checkbox" id="remember">
    <span id="remember-label">Always dark on <b id="host2"></b></span>
  </label>
  <div id="remember-note" class="note" hidden></div>

  <section class="palette">
    <label class="row"><input type="checkbox" id="auto">
      <span>Auto-dark sites I have not seen</span></label>

    <label class="row"><input type="checkbox" id="accent">
      <span>Tint white/grey text</span></label>

    <div class="row ink">
      <span class="lbl">Master ink</span>
      <input type="color" id="ink" value="#2f9eae">
      <code id="inkhex">#2f9eae</code>
    </div>

    <div class="row ink">
      <span class="lbl">This site only</span>
      <input type="color" id="siteink" value="#2f9eae">
      <button id="site-save" class="mini">Save</button>
      <button id="site-clear" class="mini" hidden>Clear</button>
    </div>
    <div id="site-note" class="note" hidden></div>
  </section>

  <button id="btn-tune" class="big">🎯 Tune in place…</button>
  <div id="tune-note" class="note" hidden>Point at an element, pick a class, tune the colour, save it for this host.</div>

  <footer>Auto-dark is ON until you turn it off. Sites you switch off stay light.</footer>
  <script src="popup.js"></script>
</body>
</html>
